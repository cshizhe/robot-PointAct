mm_datasets:

lerobot_datasets:

  - repo_id: hybridvla_10tasks_train_keysteps
    root: robot_data/rlbench/lerobot_point_lmdb
    class_name: LeRobotPointCloudDataset
    select_video_keys: [observation.images.front_image]
    video_key_ids_for_vlm: []
    select_state_keys: [observation.state]
    select_action_keys: [action]
    converted_rot_type: euler # euler, rot6d
    is_action_eef: True
    is_delta_action: False
    points_workspace: {
      'X_BBOX': [-0.5, 1.5],      # 0 is the robot base
      'Y_BBOX': [-1, 1],          # 0 is the robot base 
      'Z_BBOX': [0.7505, 2],      # 0 is the floor, 0.75 table height
    }
    max_npoints: 4096
    augment_pc_rot: 30
    point_cloud_dirname: points_frontview
    state_action_norm_file: robot_data/rlbench/lerobot_point_lmdb/hybridvla_10tasks_train_keysteps/robot_state_action_stats/euler_points_frontview_clf.json
